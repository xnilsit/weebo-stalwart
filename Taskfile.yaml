version: "3"

includes:
  mise: ./.tasks/mise.yaml
  # cog.toml, rendered from weebo-operator-kit's template (task kit:cog),
  # and the pins on the kit (task kit:sync).
  kit: ./.tasks/kit.yaml
  # The disposable Stalwart of the live suites (stalwart:container:start).
  stalwart: ./.tasks/stalwart.yaml
  # The kit's shared tasks, pinned to the kit tag of Cargo.toml and to
  # their sha256: `task kit:sync` rewrites both. `task --offline` runs from
  # Task's cache.
  rust:
    taskfile: https://raw.githubusercontent.com/weebo-si-operator/weebo-operator-kit/v0.32.0/tasks/rust.yaml
    checksum: a44fdcef4f3675efb8b8727c590703adfe88cbcc8012d1a974cbf86c4af7a900
    vars:
      # `task coverage` runs the live suites too (--include-ignored).
      COVERAGE_ENV_FILE: .stalwart-test.env
      COVERAGE_REQUIRE_ENV: STALWART_URL STALWART_TOKEN STALWART_APP_PASSWORD_TOKEN
  repo:
    taskfile: https://raw.githubusercontent.com/weebo-si-operator/weebo-operator-kit/v0.32.0/tasks/repo.yaml
    checksum: 9ea3cadd84ffd6a9fac6e8d8d328f186b55b2a28890292d9b173d1496e14908f
    vars:
      CONTAINERFILES: Containerfile Containerfile.static
      NPM_DIR: docs
  helm:
    taskfile: https://raw.githubusercontent.com/weebo-si-operator/weebo-operator-kit/v0.32.0/tasks/helm.yaml
    checksum: c380bc9422c6ccb8ee79be961095605baecd888db59659e603f69baa277c7b20
    vars:
      CHART: deploy/charts/weebo-stalwart

# `crates/testkit` builds the `envtest` crate, whose bindgen step needs a
# real libclang.so and the C headers. Defaults match Fedora's clang-libs +
# gcc; an exported value wins, even an empty one (CI on Ubuntu sets
# BINDGEN_EXTRA_CLANG_ARGS="" — libclang-dev finds its own headers there).
env:
  LIBCLANG_PATH:
    sh: echo "${LIBCLANG_PATH-/usr/lib64}"
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: echo "${BINDGEN_EXTRA_CLANG_ARGS--I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include}"

tasks:
  init:
    desc: "Install the toolchain (mise), lock its versions (mise.lock, the first time), render cog.toml from the kit and install the git hooks"
    cmds:
      - task mise:install
      # mise.toml asks for `latest`: the lock is what makes CI and every
      # checkout install the same tools (audit ones included).
      - test -f mise.lock || task mise:lock:gen
      - task: kit:cog

  doctor:
    desc: "Check the local dev setup needed by envtest (Go, libclang, control-plane binaries), the chart tools and the git hooks"
    cmds:
      - task: rust:doctor
        vars: { DOCTOR_TOOLS: "helm hadolint cargo-llvm-cov" }

  recu:
    desc: "Regenerate every committed artifact: the CRDs (crdgen), their copies in the chart, and the docs site's CRD and operator reference pages"
    cmds:
      - mise exec -- cargo run -q -p crdgen -- --out deploy/crd/
      # The chart ships the CRDs as templates (Helm never upgrades crds/),
      # under `crds.install` + `helm.sh/resource-policy: keep`.
      - task: helm:crds
      # CRD reference pages + form schemas of the docs site, and its operator
      # reference (reason codes and metrics read from crates/):
      # weebo-crd-docs (@weebo/operator-docs) reads docs/crd-docs.config.mjs
      # and clears its own previous outputs.
      - task: docs:deps
      - mise exec -- npm run gen:crds --prefix docs --silent

  lint:
    desc: "cargo fmt --check + clippy -D warnings, actionlint on CI, hadolint on the Containerfiles"
    cmds:
      - task: rust:lint
      - task: repo:lint

  docs:deps:
    desc: "Install the docs site's npm dependencies (from the lockfile) when missing"
    status:
      - test -d docs/node_modules
    cmds:
      - mise exec -- npm ci --prefix docs --no-fund

  docs:
    desc: "Run the Fumadocs documentation site in dev mode (http://localhost:3000)"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run dev

  docs:build:
    desc: "Production build + lint of the documentation site"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run lint
      - mise exec -- npm run build

  lint:helm:
    desc: "helm lint + smoke renders of the operator chart (the kit's value combinations)"
    cmds:
      - task: helm:lint

  test:
    desc: "Fast unit + contract tests (lib-level, no cluster)"
    cmds:
      # --no-fail-fast: one failing crate must not hide the others' results.
      - mise exec -- cargo test --workspace --lib --bins --no-fail-fast

  test:integration:
    desc: "Every test target, including the envtest integration tests under crates/*/tests"
    cmds:
      - mise exec -- cargo test --workspace --tests --no-fail-fast

  test:all:
    desc: "Every test suite: unit/contract + integration"
    cmds:
      - task: test
      - task: test:integration

  test:live-stalwart:
    desc: >
      The live suites against the Stalwart the test container runs
      (v1.2.0 by default, IMAGE=… for another; ignored by default): the
      JMAP gateway, SMTP submission and delivery (RFC 0001 Q4, Q8),
      then the controllers end to end on envtest, then the importer
      linking pre-existing objects. Needs
      STALWART_URL, STALWART_TOKEN and STALWART_APP_PASSWORD_TOKEN —
      exported, or read from .stalwart-test.env (`task stalwart:container:start ENGINE=podman`).
    cmds:
      - mise exec -- cargo test -p adapters-outbound --test live_stalwart -- --ignored --test-threads=1
      - mise exec -- cargo test -p adapters-outbound --test live_smtp -- --ignored --test-threads=1
      - mise exec -- cargo test -p adapters-inbound --test live_stalwart -- --ignored
      - mise exec -- cargo test -p importer --test live_stalwart -- --ignored

  coverage:
    desc: >
      Line coverage of every test layer (unit, contract, envtest, perf, and
      the live suites against a real Stalwart), failing under 85%. Needs
      STALWART_URL/STALWART_TOKEN/STALWART_APP_PASSWORD_TOKEN — exported,
      or read from .stalwart-test.env (`task stalwart:container:start ENGINE=podman`).
      Writes target/lcov.info.
    cmds:
      - task: rust:coverage

  perf:
    desc: >
      What the operator costs a cluster (weebo-kit-perf): the release binary
      against envtest and a fake Stalwart — idle, burst, churn, delete of
      StalwartMailingLists — checked against the small-cluster budget;
      report in target/perf/. PERF_OBJECTS, PERF_IDLE_SECS;
      WEEBO_PERF_BASELINE=<previous json>; WEEBO_PERF_REPORT_ONLY=1 to
      report without failing.
    cmds:
      - mise exec -- cargo test --release -p operator --test perf -- --ignored --nocapture

  audit:
    desc: "Check dependencies and the Containerfiles for CVE (cargo-deny + trivy, npm audit on the docs site, trivy config)"
    cmds:
      # advisories (RUSTSEC, yanked, unmaintained), licenses and sources —
      # see deny.toml — then trivy on Cargo.lock as a second opinion.
      - task: rust:audit
      # The docs site's shipped dependencies, and misconfigurations in both
      # images' build files. Image *contents* need a built image: see the
      # CI publish workflow, which scans what it pushes.
      - task: repo:audit
