name: Publish

# A pushed release tag `vX.Y.Z` (a bump made locally with `cog bump`):
# weebo-operator-kit's publish workflow — the operator image of each variant
# (Red Hat Hummingbird, and a statically linked one as `-static`; both ship
# the importer), scanned by Grype
# (accepted findings: .grype.yaml), smoke-run, signed; the chart (OCI); the
# GitHub Release. The static variant is optional: a failure there leaves it
# out of the release instead of blocking it.
#
# Images are multi-arch (amd64, arm64), each platform built on a native
# runner and joined into one tag per variant (`native: true`).
#
# The chart is named after the repository, the image after the repository
# with `-operator`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to (re)publish.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    # Native multi-arch build: the kit fork's feat/native-multiarch, until upstream.
    uses: xnilsit/weebo-operator-kit/.github/workflows/publish.yml@eb63ccde157971591d09616a4188cadc5d7624e9 # feat/native-multiarch
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      image: ghcr.io/${{ github.repository }}-operator
      chart: ${{ github.event.repository.name }}
      chart-repo: ghcr.io/weebo-si-operator/charts
      variants: >-
        [{"file": "Containerfile", "suffix": "", "required": true},
         {"file": "Containerfile.static", "suffix": "-static", "required": false}]
      # The importer's --version: proves the image runs and ships it.
      smoke-entrypoint: /usr/local/bin/weebo-stalwart-importer
      smoke-args: --version
      platforms: linux/amd64,linux/arm64
      native: true
